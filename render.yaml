services:
  - type: web
    name: mi-trafico-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mi-trafico-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URLS
        value: http://localhost:5173
      - key: NODE_VERSION
        value: "22"

databases:
  - name: mi-trafico-db
    plan: free
    databaseName: mi_trafico
    user: mi_trafico_user
