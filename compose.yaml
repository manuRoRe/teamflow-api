services:
  postgres:
    image: postgres:17-alpine
    container_name: teamflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mi_trafico
    ports:
      - "5433:5432"
    volumes:
      - teamflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mi_trafico"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  teamflow_postgres_data:
